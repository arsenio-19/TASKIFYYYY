<div class="login-form-wrap">

  <div class="login-brand">
    <img src="assets/logo.jpg" alt="Taskify">
    <span>Taskify</span>
  </div>

  <h1 id="authTitle">Welcome Back!</h1>

  <p id="authSubtitle">
    Enter your details below
  </p>


  <form id="authForm">

    <label id="nameField" class="hidden">
      Full name

      <input
        type="text"
        id="authName"
        placeholder="Aufha Abyan"
      >
    </label>


    <label>
      Email

      <input
        type="email"
        id="authEmail"
        placeholder="hello.alex@gmail.com"
        required
      >
    </label>


    <label>
      Password

      <div class="pw-wrap">

        <input
          type="password"
          id="authPassword"
          placeholder="••••••"
          required
          minlength="3"
        >

        <button
          type="button"
          id="togglePw"
        >
          👁
        </button>

      </div>

    </label>


    <div class="login-row">

      <label class="remember">
        <input
          type="checkbox"
          id="rememberMe"
          checked
        >
        <span>Remember me</span>
      </label>

      <a href="#" class="forgot">
        Forgot password?
      </a>

    </div>


    <button
      type="submit"
      class="btn-primary full"
      id="submitBtn"
    >
      Log in
    </button>


    <button
      type="button"
      class="btn-google full"
    >
      <span>G</span>
      Log in with Google
    </button>

  </form>


  <p class="switch-auth">

    <span id="switchText">
      Don't have an account?
    </span>

    <a href="#" id="switchAuthLink">
      Sign Up
    </a>

  </p>


  <button
    type="button"
    id="continueGuest"
    class="continue-guest"
  >
    Continue browsing without logging in →
  </button>

</div>
