<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taskify — Plan. Focus. Achieve.</title>

<link rel="icon" href="assets/logo.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===================== APP VIEW ===================== -->

<div id="appView" class="app-shell">

  <aside class="sidebar" id="sidebar">

```
<div class="sidebar-top">

  <button id="sidebarToggle" class="icon-btn" aria-label="toggle sidebar">

    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect
        x="1"
        y="3"
        width="16"
        height="12"
        rx="2.5"
        stroke="currentColor"
        stroke-width="1.5"
      />

      <line
        x1="6.5"
        y1="3"
        x2="6.5"
        y2="15"
        stroke="currentColor"
        stroke-width="1.5"
      />
    </svg>

  </button>

  <div class="brand">

    <img src="assets/logo.jpg" alt="Taskify">

    <span>Taskify</span>

  </div>

</div>


<button id="newPlanBtn" class="btn-primary new-plan">

  <span class="plus">+</span>

  <span class="label">
    Make a new plan
  </span>

</button>


<div class="mini-calendar">

  <div class="mc-head">

    <span id="mcMonthLabel">
      January 2026
    </span>

    <div class="mc-nav">

      <button
        id="mcPrev"
        class="icon-btn small"
        aria-label="previous month"
      >
        ‹
      </button>

      <button
        id="mcNext"
        class="icon-btn small"
        aria-label="next month"
      >
        ›
      </button>

    </div>

  </div>


  <div class="mc-weekdays">

    <span>S</span>
    <span>M</span>
    <span>T</span>
    <span>W</span>
    <span>T</span>
    <span>F</span>
    <span>S</span>

  </div>


  <div
    class="mc-grid"
    id="mcGrid"
  ></div>

</div>


<div class="sidebar-footer">

  <div
    class="user-chip"
    id="sidebarUserChip"
  >

    <div
      class="avatar"
      id="sidebarAvatar"
    >
      ?
    </div>

    <div class="user-info">

      <span id="sidebarUserName">
        Guest
      </span>

      <a
        href="login.html"
        id="sidebarAuthAction"
      >
        Log in
      </a>

    </div>

  </div>

</div>
```

  </aside>

  <!-- ===================== MAIN ===================== -->

  <main class="main">

```
<header class="topbar">

  <button
    id="mobileSidebarToggle"
    class="icon-btn mobile-only"
    aria-label="menu"
  >
    ☰
  </button>


  <div class="search-box">

    <svg
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
    >

      <circle
        cx="7"
        cy="7"
        r="5.2"
        stroke="currentColor"
        stroke-width="1.4"
      />

      <line
        x1="10.8"
        y1="10.8"
        x2="14.5"
        y2="14.5"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
      />

    </svg>


    <input
      type="text"
      id="searchInput"
      placeholder="Search tasks..."
    >

  </div>


  <div
    class="topbar-right"
    id="topbarAuth"
  >

    <button
      class="btn-outline"
      id="topLoginBtn"
      type="button"
      onclick="window.location.href='login.html'"
    >
      Log in
    </button>

  </div>

</header>


<!-- ===================== DAYS NAV ===================== -->

<div class="days-nav">

  <button
    id="daysPrev"
    class="icon-btn round"
    aria-label="previous days"
  >
    ‹
  </button>


  <div
    class="days-scroller"
    id="daysScroller"
  ></div>


  <button
    id="daysNext"
    class="icon-btn round"
    aria-label="next days"
  >
    ›
  </button>

</div>


<!-- ===================== BOARD ===================== -->

<section
  class="board"
  id="board"
></section>
```

  </main>

</div>

<!-- ===================== TASK MODAL ===================== -->

<div
  id="taskModalOverlay"
  class="modal-overlay hidden"
>

  <div class="modal">

```
<div class="modal-head">

  <h2 id="modalTitle">
    New Task
  </h2>

  <button
    class="icon-btn"
    id="closeModal"
    aria-label="close"
  >
    ✕
  </button>

</div>


<form id="taskForm">

  <label>
    Title

    <input
      type="text"
      id="taskTitleInput"
      placeholder="e.g. Design task dashboard"
      required
    >

  </label>


  <label>
    Description

    <textarea
      id="taskDescInput"
      rows="2"
      placeholder="What is this task about?"
    ></textarea>

  </label>


  <div class="form-row">

    <label>
      Date

      <input
        type="date"
        id="taskDateInput"
        required
      >

    </label>


    <label>
      Time

      <input
        type="time"
        id="taskTimeInput"
      >

    </label>

  </div>


  <label>

    Category

    <div
      class="category-picker"
      id="categoryPicker"
    ></div>

  </label>


  <div class="modal-actions">

    <button
      type="button"
      class="btn-outline"
      id="deleteTaskBtn"
    >
      Delete
    </button>


    <button
      type="submit"
      class="btn-primary"
    >
      Save Task
    </button>

  </div>

</form>
```

  </div>

</div>

<!-- ===================== TOAST ===================== -->

<div
  id="toast"
  class="toast hidden"
></div>

<script src="script.js"></script>

</body>
</html>
